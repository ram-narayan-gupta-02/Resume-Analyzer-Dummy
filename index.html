<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Calculator</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0f172a;
        --card: rgba(15, 23, 42, 0.85);
        --card-border: rgba(148, 163, 184, 0.15);
        --display-bg: #0b1220;
        --display-text: #f8fafc;
        --muted-text: #94a3b8;
        --number: #1e293b;
        --number-hover: #334155;
        --operation: #2563eb;
        --operation-hover: #1d4ed8;
        --function: #f97316;
        --function-hover: #ea580c;
        --equal: #22c55e;
        --equal-hover: #16a34a;
        --shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
        color: var(--display-text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .calculator {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      .calculator-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .calculator-header h1 {
        font-size: 1.2rem;
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-text);
      }

      .display {
        background: var(--display-bg);
        border-radius: 18px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 110px;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.1);
      }

      .previous {
        font-size: 0.95rem;
        color: var(--muted-text);
        min-height: 1.2em;
        text-align: right;
        word-break: break-word;
      }

      .current {
        font-size: clamp(2rem, 4vw, 2.6rem);
        text-align: right;
        word-break: break-word;
        transition: font-size 0.2s ease;
      }

      .button-grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 16px;
        padding: 16px;
        font-size: 1.2rem;
        font-weight: 600;
        color: #f8fafc;
        background: var(--number);
        cursor: pointer;
        transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 6px 14px rgba(15, 23, 42, 0.25);
      }

      button:hover {
        transform: translateY(-2px);
      }

      button:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: none;
      }

      .btn-number:hover {
        background: var(--number-hover);
      }

      .btn-operation {
        background: var(--operation);
      }

      .btn-operation:hover {
        background: var(--operation-hover);
      }

      .btn-function {
        background: var(--function);
      }

      .btn-function:hover {
        background: var(--function-hover);
      }

      .btn-equal {
        background: var(--equal);
        grid-column: span 2;
      }

      .btn-equal:hover {
        background: var(--equal-hover);
      }

      .span-two {
        grid-column: span 2;
      }

      @media (max-width: 480px) {
        .calculator {
          padding: 20px;
          border-radius: 20px;
        }

        button {
          padding: 14px;
          font-size: 1.05rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <div class="calculator-header">
        <h1>Calculator</h1>
      </div>
      <section class="display" aria-live="polite">
        <div class="previous" data-previous></div>
        <div class="current" data-current>0</div>
      </section>
      <section class="button-grid">
        <button class="btn-function" data-clear>C</button>
        <button class="btn-function" data-delete>DEL</button>
        <button class="btn-operation" data-operation="÷">÷</button>
        <button class="btn-operation" data-operation="×">×</button>

        <button class="btn-number" data-number="7">7</button>
        <button class="btn-number" data-number="8">8</button>
        <button class="btn-number" data-number="9">9</button>
        <button class="btn-operation" data-operation="-">-</button>

        <button class="btn-number" data-number="4">4</button>
        <button class="btn-number" data-number="5">5</button>
        <button class="btn-number" data-number="6">6</button>
        <button class="btn-operation" data-operation="+">+</button>

        <button class="btn-number" data-number="1">1</button>
        <button class="btn-number" data-number="2">2</button>
        <button class="btn-number" data-number="3">3</button>
        <button class="btn-equal" data-equals>=</button>

        <button class="btn-number span-two" data-number="0">0</button>
        <button class="btn-number" data-number=".">.</button>
      </section>
    </main>

    <script>
      const previousDisplay = document.querySelector("[data-previous]");
      const currentDisplay = document.querySelector("[data-current]");
      const numberButtons = document.querySelectorAll("[data-number]");
      const operationButtons = document.querySelectorAll("[data-operation]");
      const clearButton = document.querySelector("[data-clear]");
      const deleteButton = document.querySelector("[data-delete]");
      const equalsButton = document.querySelector("[data-equals]");

      let currentValue = "0";
      let previousValue = "";
      let operator = "";
      let shouldResetDisplay = false;

      const updateDisplay = () => {
        currentDisplay.textContent = currentValue;
        previousDisplay.textContent = previousValue
          ? `${previousValue} ${operator}`
          : "";
        adjustFontSize();
      };

      const adjustFontSize = () => {
        const length = currentValue.length;
        if (length > 14) {
          currentDisplay.style.fontSize = "1.6rem";
        } else if (length > 10) {
          currentDisplay.style.fontSize = "2rem";
        } else {
          currentDisplay.style.fontSize = "";
        }
      };

      const appendNumber = (value) => {
        if (currentValue === "0" || shouldResetDisplay) {
          currentValue = value === "." ? "0." : value;
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        if (value === "." && currentValue.includes(".")) {
          return;
        }

        currentValue += value;
        updateDisplay();
      };

      const chooseOperation = (nextOperator) => {
        if (currentValue === "Error") {
          return;
        }

        if (previousValue) {
          compute();
        }

        operator = nextOperator;
        previousValue = currentValue;
        shouldResetDisplay = true;
        updateDisplay();
      };

      const compute = () => {
        const prev = parseFloat(previousValue);
        const current = parseFloat(currentValue);

        if (Number.isNaN(prev) || Number.isNaN(current)) {
          return;
        }

        let result;
        switch (operator) {
          case "+":
            result = prev + current;
            break;
          case "-":
            result = prev - current;
            break;
          case "×":
            result = prev * current;
            break;
          case "÷":
            if (current === 0) {
              currentValue = "Error";
              previousValue = "";
              operator = "";
              shouldResetDisplay = true;
              updateDisplay();
              return;
            }
            result = prev / current;
            break;
          default:
            return;
        }

        currentValue = formatResult(result);
        previousValue = "";
        operator = "";
        shouldResetDisplay = true;
        updateDisplay();
      };

      const formatResult = (value) => {
        if (!Number.isFinite(value)) {
          return "Error";
        }
        const formatted = value.toString();
        return formatted.length > 16 ? value.toPrecision(10) : formatted;
      };

      const clearAll = () => {
        currentValue = "0";
        previousValue = "";
        operator = "";
        shouldResetDisplay = false;
        updateDisplay();
      };

      const deleteLast = () => {
        if (shouldResetDisplay || currentValue === "Error") {
          currentValue = "0";
          shouldResetDisplay = false;
          updateDisplay();
          return;
        }

        currentValue = currentValue.length > 1 ? currentValue.slice(0, -1) : "0";
        updateDisplay();
      };

      numberButtons.forEach((button) => {
        button.addEventListener("click", () => appendNumber(button.dataset.number));
      });

      operationButtons.forEach((button) => {
        button.addEventListener("click", () =>
          chooseOperation(button.dataset.operation)
        );
      });

      equalsButton.addEventListener("click", () => {
        if (!operator || shouldResetDisplay) {
          return;
        }
        compute();
      });

      clearButton.addEventListener("click", clearAll);
      deleteButton.addEventListener("click", deleteLast);

      window.addEventListener("keydown", (event) => {
        if (event.key >= "0" && event.key <= "9") {
          appendNumber(event.key);
        }
        if (event.key === ".") {
          appendNumber(".");
        }
        if (["+", "-", "*", "/"].includes(event.key)) {
          const map = { "*": "×", "/": "÷" };
          chooseOperation(map[event.key] || event.key);
        }
        if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          compute();
        }
        if (event.key === "Backspace") {
          deleteLast();
        }
        if (event.key === "Escape") {
          clearAll();
        }
      });

      updateDisplay();
    </script>
  </body>
</html>
